    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="./assets/js/app.js"></script>

    <script>
      const prevBtn = document.querySelector(".prev-btn");
      const nextBtn = document.querySelector(".next-btn");

      let isAnimating = false;

      const textSwiper = new Swiper(".text-swiper", {
        effect: "fade",
        allowTouchMove: false,
        speed: 700,
      });

      const videoSwiper = new Swiper(".video-swiper", {
        effect: "fade",
        allowTouchMove: false,
        speed: 700,
        on: {
          init(swiper) {
            playActiveVideo(swiper);
            updateButtons(swiper);
          },
          slideChange(swiper) {
            playActiveVideo(swiper);
            updateButtons(swiper);
          },
        },
      });

      function playActiveVideo(swiper) {
        document.querySelectorAll(".video-swiper video").forEach((video) => {
          video.pause();
          video.currentTime = 0;
        });

        const activeVideo =
          swiper.slides[swiper.activeIndex].querySelector("video");

        if (activeVideo) {
          activeVideo.play();
        }
      }

      function updateButtons(swiper) {
        prevBtn.classList.toggle("hide", swiper.isBeginning);
        nextBtn.classList.toggle("hide", swiper.isEnd);
      }

      function resetContentImages() {
        document.querySelectorAll(".content-text").forEach((box) => {
          box.classList.remove("move-img");
        });
      }

      nextBtn.addEventListener("click", () => {
        if (videoSwiper.isEnd || isAnimating) return;

        isAnimating = true;

        const currentContent = document.querySelector(
          ".text-swiper .swiper-slide-active .content-text",
        );

        if (currentContent) {
          currentContent.classList.add("move-img");
        }

        setTimeout(() => {
          videoSwiper.slideNext();
          textSwiper.slideNext();

          setTimeout(() => {
            resetContentImages();
            isAnimating = false;
          }, 100);
        }, 450);
      });

      prevBtn.addEventListener("click", () => {
        if (videoSwiper.isBeginning || isAnimating) return;

        videoSwiper.slidePrev();
        textSwiper.slidePrev();
        resetContentImages();
      });
    </script>
